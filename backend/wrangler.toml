name = "nooralhuda-admin-api"
main = "src/index.ts"
compatibility_date = "2026-10-04"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "nooralhuda-2026"
CF_ACCOUNT_ID = "60e42db4ec7bdb598909c00224b24587"
QF_ENV = "production"
# Set to "true" only after direct-APK App Check compatibility is validated on device.
REQUIRE_APP_CHECK = "false"
# Max proxied AI calls per user per UTC day (audit counter in Firestore).
AI_DAILY_LIMIT = "50"

# Secrets (set via `wrangler secret put`, never in this file):
#   QF_CLIENT_ID, QF_CLIENT_SECRET
#   AI_BASE_URL, AI_API_KEY, AI_CHAT_MODEL (added when the admin configures a provider)
#   CF_API_TOKEN (one-time human step: Cloudflare API token for self-managing
#     Worker secrets from the dashboard; then providers rotate via web UI)

[assets]
directory = "./public"
not_found_handling = "none"
