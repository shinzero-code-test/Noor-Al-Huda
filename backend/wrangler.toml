name = "nooralhuda-admin-api"
main = "src/index.ts"
compatibility_date = "2026-10-04"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "nooralhuda-2026"
QF_ENV = "production"
# Set to "true" only after direct-APK App Check compatibility is validated on device.
REQUIRE_APP_CHECK = "false"

# Secrets (set via `wrangler secret put`, never in this file):
#   QF_CLIENT_ID, QF_CLIENT_SECRET
#   AI_BASE_URL, AI_API_KEY, AI_CHAT_MODEL (added when the admin configures a provider)
