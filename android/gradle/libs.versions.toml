# Pinned 2026-10-05 from official sources:
# AGP 9.4.0 (Gradle 9.6.0, JDK 17), Kotlin 2.4.20, KSP 2.3.10,
# Compose BOM 2026.09.00, Room 2.8.5, Navigation 2.10.1, Lifecycle 2.11.0,
# Hilt 2.60.1, androidx.hilt 1.4.0, DataStore 1.2.1,
# coroutines-test 1.11.0, Turbine 1.2.1.
[versions]
agp = "8.13.2"
kotlin = "2.4.20"
ksp = "2.3.10"
composeBom = "2026.09.00"
room = "2.8.5"
navigation = "2.10.1"
lifecycle = "2.11.0"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
datastore = "1.2.1"
coroutinesTest = "1.11.0"
turbine = "1.2.1"
junit = "4.13.2"

[libraries]
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
